# CI/CD du projet « Dev avec Docker »
#   1. compose : valide la stack infra (compose.yml + surcharges)
#   2. image   : build de l'image Rallly du fork, scan Trivy, push sur GHCR
#                (push uniquement sur main ; les PR sont buildées et scannées)
name: Projet CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: projet-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compose:
    name: Valider la stack Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: .env factice depuis .env.example
        working-directory: infra
        run: sh scripts/init-env.sh

      - name: docker compose config (local, build, VM)
        working-directory: infra
        run: |
          docker compose -f compose.yml config -q
          docker compose -f compose.yml -f compose.build.yml config -q
          docker compose -f compose.yml -f compose.vm.yml config -q

      - name: Syntaxe des scripts shell
        run: |
          sh -n infra/scripts/init-env.sh
          bash -n infra/scripts/vm-bootstrap.sh

  image:
    name: Build, scan et publication de l'image Rallly
    runs-on: ubuntu-latest
    needs: compose
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - name: Nom d'image en minuscules (exigence GHCR)
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Connexion à GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Build chargé localement pour pouvoir le scanner AVANT de le publier
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: |
            SELF_HOSTED=true
            APP_VERSION=${{ github.sha }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scan des vulnérabilités : rapport des HIGH/CRITICAL corrigeables.
      # exit-code 0 : le scan informe sans bloquer (vulnérabilités héritées de
      # l'upstream / de l'image Node, hors de notre contrôle) ; voir le résumé du job.
      - name: Scan Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table
          output: trivy-report.txt

      - name: Résumé du scan
        if: always()
        run: |
          {
            echo "## Scan Trivy (HIGH/CRITICAL corrigeables)"
            echo '```'
            cat trivy-report.txt 2>/dev/null || echo "rapport indisponible"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-report.txt

      - name: Push sur GHCR
        if: github.event_name != 'pull_request'
        run: docker push --all-tags "$IMAGE"